[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroform"
version = "0.1.0"
description = "ZEROFORM — Security Reality Compiler: turns a declarative Reality Model into an executable, testable, simulate-able security architecture."
readme = "README (1).markdown"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "networkx>=3.2",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "websockets>=12.0",
]

[project.scripts]
zeroform = "zeroform.cli:main"

[tool.setuptools.packages.find]
include = ["zeroform*"]
